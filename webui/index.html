<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPC Web UI</title>
<style>
  :root {
    --bg: #FAF9F5;          /* Claude ivory background */
    --panel: #F0EEE6;       /* warm sand panel */
    --panel-2: #FFFFFF;     /* white surfaces */
    --border: #E0DCCF;
    --border-2: #D6D1C2;
    --text: #3D3929;        /* warm dark gray */
    --muted: #87867F;
    --accent: #D97757;      /* Claude terracotta orange */
    --accent-2: #C4633F;    /* hover */
    --accent-soft: #F7E9DF; /* soft orange tint (user bubble) */
    --green: #3E7B4F;
    --red: #C7442E;
    --yellow: #B8860B;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: row;
    overflow: hidden;
  }

  /* left sidebar: session list */
  #sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sb-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 12px 8px; font-weight: 700; font-size: 13px;
  }
  .sb-head button { padding: 4px 10px; font-size: 12px; border-radius: 7px; }
  #sessionList { flex: 1 1 46%; min-height: 96px; overflow-y: auto; padding: 0 8px 8px; }
  .sb-sep { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 10px; }
  .sb-sub { font-size: 10px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
  /* fork graph: a git-graph-like tree of conversations & their forks */
  #branchGraph { flex: 1 1 54%; min-height: 150px; overflow-y: auto; padding: 0 8px 12px; }
  .gg-empty { color: var(--muted); font-size: 12px; padding: 6px 10px; }
  .gg-node .gg-row {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    padding: 5px 6px; border-radius: 7px; cursor: pointer; font-size: 12px;
    border: 1px solid transparent;
  }
  .gg-node .gg-row:hover { background: var(--panel-2); }
  .gg-node.active > .gg-row { background: var(--panel-2); border-color: var(--accent); }
  .gg-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--border-2); }
  .gg-node .gg-row:hover .gg-dot { background: var(--accent); }
  .gg-node.active > .gg-row .gg-dot { background: var(--accent); }
  .gg-node.root > .gg-row .gg-title { font-weight: 600; }
  .gg-title {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; color: var(--text);
  }
  .gg-node.fork > .gg-row .gg-title::before { content: '↳ '; color: var(--accent-2); }
  .gg-run { flex: none; font-size: 10px; color: var(--accent); animation: pulse 1.2s infinite; }
  .gg-children { margin-left: 11px; padding-left: 9px; border-left: 2px solid var(--border); }
  .sess-item {
    padding: 8px 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
    border: 1px solid transparent;
  }
  .sess-item:hover { background: var(--panel-2); }
  .sess-item.active { background: var(--panel-2); border-color: var(--accent); }
  .sess-item .sess-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .sess-item .s-title {
    flex: 1; min-width: 0;
    font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .sess-del {
    flex: none; border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 12px; line-height: 1; padding: 3px 5px; border-radius: 6px;
    visibility: hidden;
  }
  .sess-item:hover .sess-del, .sess-item.active .sess-del { visibility: visible; }
  .sess-del:hover { color: var(--red); background: rgba(199, 68, 46, 0.12); }
  .sess-item .s-time {
    font-size: 11px; color: var(--muted); margin-top: 2px;
    display: flex; justify-content: space-between; gap: 6px;
  }
  .sess-item .s-running { color: var(--accent); animation: pulse 1.2s infinite; }
  .sb-empty { color: var(--muted); font-size: 12px; padding: 8px 10px; }

  #mainCol { flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header .brand { font-weight: 700; font-size: 15px; margin-right: 8px; }
  header .brand span { color: var(--accent); }
  select, input[type="text"] {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border-2);
    border-radius: 8px;
    padding: 5px 8px;
    font-size: 13px;
  }
  label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 5px; }
  #status {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.running { background: var(--accent); animation: pulse 1.2s infinite; }
  .dot.idle { background: var(--green); }
  .dot.error { background: var(--red); }
  @keyframes pulse { 50% { opacity: .3; } }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    margin-bottom: 18px;
    display: flex;
    gap: 10px;
  }
  .msg .avatar {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 700; font-size: 13px; margin-top: 2px;
    user-select: none; color: #fff;
  }
  .msg.user .avatar { background: var(--accent); }
  .msg.assistant .avatar { background: var(--text); }
  /* user messages align right (avatar at right edge, bubble to its left); assistant stays left */
  .msg.user { flex-direction: row-reverse; }
  .msg .bubble {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    max-width: 100%;
    min-width: 0;
    overflow-wrap: break-word;
    box-shadow: 0 1px 2px rgba(61,57,41,.04);
  }
  .msg.user .bubble { background: var(--accent-soft); border-color: #EDD8C8; }
  .meta { color: var(--muted); font-size: 11px; margin-bottom: 4px; }

  /* markdown-ish */
  .bubble h1, .bubble h2, .bubble h3 { margin: 10px 0 6px; }
  .bubble p { margin: 6px 0; }
  .bubble code {
    background: var(--panel); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 4px; font-size: 12px;
    font-family: "Cascadia Code", Consolas, monospace;
  }
  .bubble pre {
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px; border-radius: 8px; overflow-x: auto;
  }
  .bubble pre code { background: none; border: none; padding: 0; }
  .bubble ul, .bubble ol { padding-left: 22px; margin: 6px 0; }
  .bubble table { border-collapse: collapse; margin: 8px 0; }
  .bubble th, .bubble td { border: 1px solid var(--border-2); padding: 4px 10px; }
  .bubble blockquote { border-left: 3px solid var(--accent); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .bubble a { color: var(--accent-2); }

  /* thinking block (streamed reasoning, collapsed by default) */
  .think {
    margin: 0 0 8px;
    border: 1px dashed var(--border-2);
    border-radius: 8px;
    background: var(--panel);
  }
  .think summary {
    cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 10px;
    user-select: none; display: flex; align-items: center; gap: 6px;
    list-style: none;
  }
  .think summary::-webkit-details-marker { display: none; }
  .think summary::before {
    content: '▸'; font-size: 10px; color: var(--border-2); transition: transform .15s;
  }
  .think[open] summary::before { transform: rotate(90deg); }
  .think .think-body {
    padding: 0 12px 8px; color: var(--muted); font-size: 12.5px;
    white-space: pre-wrap; word-break: break-word;
  }
  /* "thinking" label motion while streaming */
  .think.streaming .tlabel {
    background: linear-gradient(90deg, var(--muted) 25%, var(--accent) 50%, var(--muted) 75%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: thinkShimmer 1.6s linear infinite;
  }
  @keyframes thinkShimmer {
    from { background-position: 200% 0; }
    to { background-position: -200% 0; }
  }
  .think .tdots { display: none; align-items: center; gap: 3px; }
  .think.streaming .tdots { display: inline-flex; }
  .think .tdots i {
    width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
    opacity: .25; animation: thinkDot 1.2s infinite;
  }
  .think .tdots i:nth-child(2) { animation-delay: .2s; }
  .think .tdots i:nth-child(3) { animation-delay: .4s; }
  @keyframes thinkDot { 40% { opacity: 1; } }

  .tool {
    /* frameless: no outer panel/box — just the tool name + summary text + state icon */
    margin: 8px 0;
    font-size: 12.5px;
  }
  .tool .tool-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tool .tname { color: var(--accent-2); font-weight: 600; font-family: Consolas, monospace; flex-shrink: 0; }
  .tool .tcmd {
    font-family: "Cascadia Code", Consolas, monospace; font-size: 12px;
    color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; min-width: 0;
  }
  /* running indicator: spinner while the tool executes, check when done */
  .tool .spinner, .tool .done { flex-shrink: 0; width: 14px; height: 14px; }
  .tool .spinner {
    border: 2px solid var(--border-2); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .tool .done { display: none; align-items: center; justify-content: center; color: var(--green); font-size: 13px; }
  .tool .done::after { content: '✓'; }
  .tool:not(.running) .spinner { display: none; }
  .tool:not(.running) .done { display: flex; }

  .error-msg { color: var(--red); }

  footer {
    padding: 10px 16px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    max-width: 960px; width: 100%; margin: 0 auto;
  }
  .composer {
    display: flex; gap: 8px; align-items: flex-end;
    border: 1px solid var(--border-2); border-radius: var(--radius);
    background: var(--panel-2); padding: 8px;
    box-shadow: 0 1px 3px rgba(61,57,41,.06);
  }
  textarea {
    flex: 1; resize: none; border: none; outline: none; background: transparent;
    color: var(--text); font: inherit; max-height: 180px; min-height: 22px; padding: 4px;
  }
  button {
    background: var(--accent); color: #fff; border: none; cursor: pointer;
    border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 13px;
    white-space: nowrap;
  }
  button:hover { background: var(--accent-2); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text); }
  button.secondary:hover { background: var(--panel); }
  button.danger { background: var(--red); }
  button.danger:hover { background: #A93722; }

  .empty {
    text-align: center; color: var(--muted); margin-top: 15vh; font-size: 14px;
  }
  .empty h2 { color: var(--text); font-weight: 600; }
  .empty code { background: var(--panel); padding: 2px 8px; border-radius: 6px; }

  /* permission modal */
  #permBackdrop {
    position: fixed; inset: 0; background: rgba(61,57,41,.35);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #permBackdrop.open { display: flex; }
  #permModal {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px;
    width: min(620px, 92vw); max-height: 80vh; overflow: auto; padding: 18px;
    box-shadow: 0 8px 30px rgba(61,57,41,.15);
  }
  #permModal h3 { margin: 0 0 4px; font-size: 15px; }
  #permTool { color: var(--accent-2); font-family: Consolas, monospace; }
  #permModal pre {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 12.5px; overflow: auto; white-space: pre-wrap;
    word-break: break-word; max-height: 300px;
  }
  #permActions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }

  /* quote follow-up popup (select text in an AI reply to fork-ask) */
  #quotePopup {
    position: fixed; z-index: 60; width: 340px;
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(61,57,41,.18);
    padding: 10px 12px; display: none;
  }
  #quotePopup.open { display: block; }
  #quotePopup .qp-label { font-size: 12px; font-weight: 600; color: var(--accent-2); margin-bottom: 6px; }
  #quotePopup .qp-quote {
    font-size: 12px; color: var(--muted); background: var(--panel);
    border-left: 3px solid var(--accent); border-radius: 4px;
    padding: 4px 8px; margin-bottom: 8px;
    max-height: 72px; overflow: hidden;
  }
  #quotePopup input {
    width: 100%; margin-bottom: 8px;
  }
  #quotePopup .qp-actions { display: flex; gap: 8px; justify-content: flex-end; }
  #quotePopup .qp-actions button { padding: 4px 12px; font-size: 12px; }

  /* fork-graph hover preview: "who is who" first-message peek */
  #ggTip {
    position: fixed; z-index: 70; max-width: 300px; display: none;
    background: var(--panel-2); border: 1px solid var(--border-2); border-radius: 9px;
    box-shadow: 0 6px 22px rgba(61,57,41,.18); padding: 9px 11px;
    font-size: 12px; color: var(--text); pointer-events: none;
  }
  #ggTip .gt-kind { color: var(--accent-2); font-weight: 700; font-size: 11px; margin-bottom: 4px; }
  #ggTip .gt-title { font-weight: 600; margin-bottom: 3px; }
  #ggTip .gt-body {
    white-space: pre-wrap; word-break: break-word;
    max-height: 220px; overflow: hidden;
  }
  #ggTip .gt-meta { margin-top: 6px; color: var(--muted); font-size: 11px; }

  .cursor { display:inline-block; width:7px; height:14px; background:var(--accent); vertical-align:-2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<aside id="sidebar">
  <div class="sb-head">
    <span>会话</span>
    <button id="newChatBtn" class="secondary">＋ 新建会话</button>
  </div>
  <div id="sessionList"></div>
  <div class="sb-head sb-sep"><span class="sb-sub">FORK 图谱</span></div>
  <div id="branchGraph"><div class="gg-empty">暂无分支</div></div>
</aside>

<div id="mainCol">

<header>
  <div class="brand">OPC <span>Web UI</span></div>
  <label>模型
    <select id="modelSel">
      <option value="">默认 (CLI 配置)</option>
      <option>sonnet</option><option>opus</option><option>haiku</option>
    </select>
  </label>
  <label>权限
    <select id="permSel">
      <option value="acceptEdits">acceptEdits</option>
      <option value="default">default (逐项询问)</option>
      <option value="plan">plan</option>
      <option value="bypassPermissions">bypassPermissions</option>
    </select>
  </label>
  <label>目录
    <input type="text" id="cwdInput" style="width:220px" placeholder="工作目录（默认仓库根）" />
  </label>
  <div id="status"><span class="dot idle" id="statusDot"></span><span id="statusText">空闲</span></div>
</header>

<main id="messages">
  <div class="empty" id="emptyState">
    <h2>本地 OPC Web 界面</h2>
    <p>在下方输入问题，回车发送。<br />模型/权限/目录修改后会作用于下一次发送。<br />CLI 事件经 SSE 实时流式显示。</p>
  </div>
</main>

<footer>
  <div class="composer">
    <textarea id="promptInput" rows="1" placeholder="问点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="stopBtn" class="danger" disabled>停止</button>
    <button id="sendBtn">发送</button>
  </div>
</footer>

</div><!-- /mainCol -->

<div id="permBackdrop">
  <div id="permModal">
    <h3>工具权限请求</h3>
    <div style="color:var(--muted);font-size:12px;margin-bottom:8px">CLI 请求使用工具 <span id="permTool"></span></div>
    <pre id="permInput"></pre>
    <div id="permActions">
      <button id="permDeny" class="secondary">拒绝</button>
      <button id="permAllow">允许</button>
    </div>
  </div>
</div>

<div id="quotePopup">
  <div class="qp-label">对选中内容追问（将 fork 一个新会话）</div>
  <div class="qp-quote" id="qpQuote"></div>
  <input type="text" id="qpInput" placeholder="输入追问，回车发送（Esc 关闭）" />
  <div class="qp-actions">
    <button id="qpCancel" class="secondary">取消</button>
    <button id="qpAsk">追问</button>
  </div>
</div>

<div id="ggTip"></div>

<script>
'use strict'
// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id)
const messagesEl = $('messages')
let chatId = null // current run id (SSE routing); one per message
let conversationId = null // current conversation; persists across messages
let conversationsCache = []
let running = false
let currentPerm = null // { requestId, resolve }
let stream = null // active streaming content node (segment within the turn bubble)
let turnBubble = null // one bubble per user turn: all thinking/text/tool cards live here
const runningTools = new Set() // tool cards currently executing
let renderQueued = false
let renderedText = false
const history = []

// ---------------------------------------------------------------------------
// tiny markdown renderer (safe: escapes HTML first)
// ---------------------------------------------------------------------------
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
}
function inlineCode(s) {
  // escape, then highlight `code`
  return esc(s).replace(/`([^`]+)`/g, (_, c) => '<code>' + c + '</code>')
}
function renderMarkdown(text) {
  if (!text) return ''
  const lines = String(text).split('\n')
  let html = ''
  let inCode = false
  let codeLang = ''
  let codeBuf = []
  let inList = false
  let paraBuf = []

  const flushPara = () => {
    if (paraBuf.length) {
      html += '<p>' + inlineCode(paraBuf.join(' ')) + '</p>'
      paraBuf = []
    }
  }
  const closeList = () => {
    if (inList) { html += '</ul>'; inList = false }
  }

  for (const raw of lines) {
    const line = raw
    if (/^```/.test(line)) {
      if (!inCode) {
        flushPara(); closeList()
        inCode = true; codeLang = line.slice(3).trim(); codeBuf = []
      } else {
        html += '<pre><code' + (codeLang ? ' class="lang-' + esc(codeLang) + '"' : '') + '>' +
          esc(codeBuf.join('\n')) + '</code></pre>'
        inCode = false
      }
      continue
    }
    if (inCode) { codeBuf.push(line); continue }

    if (/^\s*$/.test(line)) { flushPara(); closeList(); continue }
    if (/^#{1,6}\s/.test(line)) {
      flushPara(); closeList()
      const m = line.match(/^(#{1,6})\s+(.*)$/)
      const lvl = m[1].length
      html += `<h${lvl}>${inlineCode(m[2])}</h${lvl}>`
      continue
    }
    if (/^\s*[-*]\s+/.test(line)) {
      flushPara()
      if (!inList) { html += '<ul>'; inList = true }
      html += '<li>' + inlineCode(line.replace(/^\s*[-*]\s+/, '')) + '</li>'
      continue
    }
    if (/^\s*\d+\.\s+/.test(line)) {
      flushPara(); closeList()
      html += '<p>' + inlineCode(line.replace(/^\s*\d+\.\s+/, '')) + '</p>'
      continue
    }
    if (/^>\s?/.test(line)) {
      flushPara(); closeList()
      html += '<blockquote>' + inlineCode(line.replace(/^>\s?/, '')) + '</blockquote>'
      continue
    }
    // tables: minimal
    if (/^\|/.test(line) && /^\|[\s:|-]+\|$/.test(line)) continue
    paraBuf.push(line)
  }
  flushPara(); closeList()
  if (inCode) html += '<pre><code>' + esc(codeBuf.join('\n')) + '</code></pre>'
  return html
}

// ---------------------------------------------------------------------------
// message rendering
// ---------------------------------------------------------------------------
function addMsg(role, text, opts = {}) {
  const empty = $('emptyState')
  if (empty) empty.remove()
  const wrap = document.createElement('div')
  wrap.className = 'msg ' + (role === 'user' ? 'user' : 'assistant')
  const avatar = role === 'user' ? '我' : 'AI'
  wrap.innerHTML =
    '<div class="avatar">' + avatar + '</div><div class="bubble">' +
    (opts.meta ? '<div class="meta">' + esc(opts.meta) + '</div>' : '') +
    '<div class="content">' + (opts.raw ? esc(text) : renderMarkdown(text || '')) + '</div></div>'
  messagesEl.appendChild(wrap)
  messagesEl.scrollTop = messagesEl.scrollHeight
  return wrap.querySelector('.content')
}

function addToolCard(node, toolName, input, id) {
  const bubble = node.closest('.bubble')
  const div = document.createElement('div')
  div.className = 'tool running'
  div.innerHTML =
    '<div class="tool-head"><span class="spinner"></span><span class="done"></span>' +
    '<span class="tname">' + esc(toolName) + '</span><span class="tcmd"></span></div>'
  bubble.appendChild(div)
  const card = { name: toolName, id: id || null, el: div, cmd: div.querySelector('.tcmd'), acc: '' }
  runningTools.add(card)
  setToolCmd(card, input)
  messagesEl.scrollTop = messagesEl.scrollHeight
  return card
}

// one-line summary of what the tool does (description field is never shown)
function toolCmdText(input) {
  if (input && typeof input === 'object') {
    if (typeof input.command === 'string' && input.command) return input.command
    for (const k of ['file_path', 'path', 'pattern', 'query', 'url', 'prompt', 'name']) {
      if (typeof input[k] === 'string' && input[k]) return input[k]
    }
    for (const [k, v] of Object.entries(input)) {
      if (k !== 'description' && typeof v === 'string' && v) return v
    }
  }
  return ''
}

function setToolCmd(card, input) {
  card.cmd.textContent = toolCmdText(input)
}

// extract the command from a partially-streamed tool input JSON
function partialCmdFromJson(acc) {
  const m = (acc || '').match(/"command"\s*:\s*"((?:[^"\\]|\\.)*)/)
  if (!m) return null
  return m[1].replace(/\\n/g, ' ').replace(/\\t/g, ' ').replace(/\\(.)/g, '$1')
}

function endToolRun(card) {
  card.el.classList.remove('running')
  runningTools.delete(card)
}

function endAllToolRuns() {
  for (const card of [...runningTools]) endToolRun(card)
}

function addSystemMsg(text, kind) {
  const wrap = document.createElement('div')
  wrap.className = 'msg ' + (kind === 'error' ? 'error-msg' : 'assistant')
  wrap.innerHTML = '<div class="avatar">ⓘ</div><div class="bubble"><div class="meta">系统</div>' +
    (kind === 'error'
      ? '<div class="error-msg">' + esc(text) + '</div>'
      : renderMarkdown(text)) + '</div>'
  messagesEl.appendChild(wrap)
  messagesEl.scrollTop = messagesEl.scrollHeight
}

// ---------------------------------------------------------------------------
// SSE
// ---------------------------------------------------------------------------
function connectEvents() {
  const es = new EventSource('/api/events')
  es.onmessage = ev => {
    let e
    try { e = JSON.parse(ev.data) } catch { return }
    // Single active chat: ignore events belonging to other chats. When idle
    // (chatId null) we only accept events that don't belong to a specific
    // chat — otherwise replayed events from finished chats would re-render.
    if (e.chatId) {
      if (e.chatId !== chatId) return
    } else if (!e.chatId && chatId) {
      // broadcast without chatId while a chat is active: treat as system noise
      return
    }
    handleEvent(e)
  }
  es.onerror = () => {
    // EventSource auto-reconnects; show transient state
    setStatus('重连中…', 'error')
  }
  es.onopen = () => {
    if (!running) setStatus('空闲', 'idle')
  }
}

// ---------------------------------------------------------------------------
// streaming helpers
// ---------------------------------------------------------------------------
function openStreamBubble() {
  const node = addMsg('assistant', '')
  node.dataset.streaming = '1'
  node.dataset.text = ''
  node._tools = {}
  node._toolQueue = []
  turnBubble = node.closest('.bubble')
  return node
}

function newSegment(bubble) {
  const content = document.createElement('div')
  content.className = 'content'
  content.dataset.streaming = '1'
  content.dataset.text = ''
  content._tools = {}
  content._toolQueue = []
  bubble.appendChild(content)
  return content
}

function getStreamNode() {
  if (stream && stream.isConnected) return stream
  if (turnBubble && turnBubble.isConnected) {
    // continue inside the same turn bubble: open a new segment
    return (stream = newSegment(turnBubble))
  }
  return (stream = openStreamBubble())
}

function appendStreamText(node, chunk) {
  if (!chunk) return
  node.dataset.text = (node.dataset.text || '') + chunk
  renderedText = true
  messagesEl.scrollTop = messagesEl.scrollHeight
  if (renderQueued) return
  renderQueued = true
  requestAnimationFrame(() => {
    renderQueued = false
    const el = messagesEl.querySelector('.msg.assistant .content[data-streaming="1"]')
    if (el) el.innerHTML = renderMarkdown(el.dataset.text || '')
  })
}

function ensureThink(node) {
  if (node._thinkBody) return
  const bubble = node.closest('.bubble')
  const details = document.createElement('details')
  details.className = 'think streaming'
  details.open = false // thinking content stays collapsed while streaming
  details.innerHTML =
    '<summary><span class="tlabel">正在思考</span><span class="tdots"><i></i><i></i><i></i></span></summary>' +
    '<div class="think-body"></div>'
  bubble.insertBefore(details, node)
  node._think = details
  node._thinkBody = details.querySelector('.think-body')
  node._thinkText = ''
}

function endThink(node) {
  const think = node && node._think
  if (!think) return
  think.classList.remove('streaming')
  think.open = false
  const label = think.querySelector('.tlabel')
  if (label) label.textContent = '已深度思考'
}

function appendThink(node, chunk) {
  ensureThink(node)
  node._thinkText = (node._thinkText || '') + (chunk || '')
  node._thinkBody.textContent = node._thinkText
  messagesEl.scrollTop = messagesEl.scrollHeight
}

function takeToolCard(node, name) {
  const queue = (node && node._toolQueue) || []
  let idx = queue.findIndex(c => c.name === name)
  if (idx === -1) idx = 0
  return queue.splice(idx, 1)[0] || null
}

function finishStream() {
  if (!stream) return
  endThink(stream)
  for (const key of Object.keys(stream._tools || {})) {
    const card = stream._tools[key]
    if (card && card.acc) {
      try { setToolCmd(card, JSON.parse(card.acc)) } catch {
        const c = partialCmdFromJson(card.acc)
        if (c) card.cmd.textContent = c
      }
    }
  }
  if (stream.dataset.text) {
    stream.innerHTML = renderMarkdown(stream.dataset.text)
  } else if (!stream._think && !Object.keys(stream._tools || {}).length) {
    // segment had no text/thinking/tool: drop the empty node, keep the turn bubble
    stream.remove()
  }
  delete stream.dataset.streaming
  stream = null
  // drop the turn bubble only if it ended up completely empty (e.g. only tool calls)
  if (turnBubble && turnBubble.isConnected && !turnBubble.querySelector('.think, .tool, .content')) {
    const msg = turnBubble.closest('.msg')
    if (msg) msg.remove()
    turnBubble = null
  }
}

function handleEvent(e) {
  switch (e.type) {
    case 'run-start':
      running = true
      stream = null
      turnBubble = null
      endAllToolRuns()
      renderedText = false
      setStatus('运行中…', 'running')
      $('sendBtn').disabled = true
      $('stopBtn').disabled = false
      break
    case 'assistant': {
      const blocks = e.message?.content || []
      let text = ''
      let thinking = ''
      const toolUses = []
      for (const b of blocks) {
        if (b.type === 'text') text += b.text || ''
        else if (b.type === 'thinking') thinking = b.thinking || ''
        else if (b.type === 'tool_use') toolUses.push(b)
      }
      const node = stream && stream.isConnected ? stream : null
      if (node) {
        // authoritative snapshot for the completed content block(s)
        if (thinking) {
          ensureThink(node)
          node._thinkText = thinking
          node._thinkBody.textContent = thinking
        }
        if (text) {
          if (text.length >= (node.dataset.text || '').length) node.dataset.text = text
          node.innerHTML = renderMarkdown(node.dataset.text || '')
          renderedText = true
        }
        for (const tu of toolUses) {
          const card = takeToolCard(node, tu.name)
          let input = tu.input
          if (input == null && card) {
            try { input = JSON.parse(card.acc || '{}') } catch { input = {} }
          }
          if (card) {
            card.id = card.id || tu.id
            setToolCmd(card, input ?? {})
          } else addToolCard(node, tu.name, input || {}, tu.id)
        }
      } else {
        // fallback when stream events were not available
        if (thinking) {
          const n = getStreamNode()
          ensureThink(n)
          n._thinkText = thinking
          n._thinkBody.textContent = thinking
        }
        if (text) {
          const n = getStreamNode()
          n.dataset.text = text
          n.innerHTML = renderMarkdown(text)
          renderedText = true
        }
        for (const tu of toolUses) addToolCard(getStreamNode(), tu.name, tu.input || {}, tu.id)
      }
      break
    }
    case 'user': {
      // user messages carrying tool_result blocks mark tool cards as done
      const blocks = Array.isArray(e.message?.content) ? e.message.content : []
      const ids = new Set()
      for (const b of blocks) if (b && b.type === 'tool_result' && b.tool_use_id) ids.add(b.tool_use_id)
      if (!ids.size) break
      for (const card of [...runningTools]) {
        if (ids.has(card.id)) endToolRun(card)
      }
      break
    }
    case 'result': {
      finishStream()
      endAllToolRuns()
      const text = e.result || ''
      // result duplicates what we already streamed; only render as fallback
      if (text && !renderedText) {
        if (turnBubble && turnBubble.isConnected) {
          const seg = newSegment(turnBubble)
          seg.innerHTML = renderMarkdown(text)
          delete seg.dataset.streaming
        } else {
          addMsg('assistant', text)
        }
      }
      markAllDone()
      break
    }
    case 'stream_event': {
      const ev = e.event || {}
      if (ev.type === 'message_start') {
        // a new assistant message implies the previous batch of tools finished
        endAllToolRuns()
        getStreamNode()
      } else if (ev.type === 'content_block_start') {
        const block = ev.content_block || {}
        if (block.type === 'thinking') {
          ensureThink(getStreamNode())
        } else if (block.type === 'tool_use') {
          const node = getStreamNode()
          const card = addToolCard(node, block.name || 'tool', {}, block.id)
          node._tools[ev.index] = card
          node._toolQueue.push(card)
        }
      } else if (ev.type === 'content_block_delta') {
        const d = ev.delta || {}
        if (d.type === 'thinking_delta') {
          appendThink(getStreamNode(), d.thinking)
        } else if (d.type === 'text_delta') {
          appendStreamText(getStreamNode(), d.text)
        } else if (d.type === 'input_json_delta') {
          const card = stream && stream._tools ? stream._tools[ev.index] : null
          if (card) {
            card.acc += d.partial_json || ''
            try {
              setToolCmd(card, JSON.parse(card.acc))
            } catch {
              const c = partialCmdFromJson(card.acc)
              if (c) card.cmd.textContent = c
            }
            messagesEl.scrollTop = messagesEl.scrollHeight
          }
        }
      } else if (ev.type === 'message_stop') {
        finishStream()
      }
      break
    }
    case 'permission_request': {
      currentPerm = { requestId: e.request_id, toolName: e.tool_name, input: e.input }
      $('permTool').textContent = e.tool_name
      let inputText = ''
      try { inputText = JSON.stringify(e.input, null, 2) } catch { inputText = String(e.input) }
      $('permInput').textContent = e.message || inputText
      $('permBackdrop').classList.add('open')
      setStatus('等待授权: ' + e.tool_name, 'running')
      break
    }
    case 'permission_resolved':
      if (currentPerm && currentPerm.requestId === e.request_id) {
        $('permBackdrop').classList.remove('open')
        currentPerm = null
      }
      break
    case 'run-end': {
      finishStream()
      endAllToolRuns()
      turnBubble = null
      running = false
      $('sendBtn').disabled = false
      $('stopBtn').disabled = true
      markAllDone()
      const status = e.stopped ? '已停止' : (e.code === 0 ? '完成' : '出错 (exit ' + e.code + ')')
      setStatus(status, e.code === 0 || e.stopped ? 'idle' : 'error')
      loadConversations() // refresh running/updated state in the sidebar
      // Allow the next message to start a fresh run; keeps late/replayed
      // events for the finished run from being rendered twice.
      chatId = null
      break
    }
    case 'error':
      if (!running) setStatus('错误', 'error')
      addSystemMsg(e.message || '未知错误', 'error')
      break
    case 'stderr':
      if (!running) addSystemMsg(e.text, 'error')
      break
    default:
      break
  }
}

function markAllDone() {
  for (const el of messagesEl.querySelectorAll('.content[data-streaming="1"]')) {
    delete el.dataset.streaming
  }
}

function setStatus(text, kind) {
  $('statusText').textContent = text
  $('statusDot').className = 'dot ' + kind
}

async function loadConversations() {
  try {
    const res = await fetch('/api/conversations')
    if (res.ok) conversationsCache = await res.json()
  } catch {
    /* server unreachable — keep the current list */
  }
  renderSidebar()
}

function fmtTime(ts) {
  const d = new Date(ts || Date.now())
  const now = new Date()
  const hm = d.toTimeString().slice(0, 5)
  return d.toDateString() === now.toDateString()
    ? hm
    : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm
}

function renderSessionList() {
  const list = $('sessionList')
  list.innerHTML = ''
  if (!conversationsCache.length) {
    list.innerHTML = '<div class="sb-empty">暂无会话</div>'
    return
  }
  for (const c of conversationsCache) {
    const item = document.createElement('div')
    item.className = 'sess-item' + (c.id === conversationId ? ' active' : '')
    item.title = c.title || ''
    item.innerHTML =
      '<div class="sess-head"><span class="s-title">' + esc(c.title || '未命名会话') + '</span>' +
      '<button class="sess-del" title="删除会话">✕</button></div>' +
      '<div class="s-time"><span>' + esc(fmtTime(c.updatedAt)) + '</span>' +
      (c.running ? '<span class="s-running">运行中</span>' : '') + '</div>'
    item.onclick = () => switchConversation(c.id)
    item.querySelector('.sess-del').onclick = ev => {
      ev.stopPropagation()
      deleteSession(c.id)
    }
    list.appendChild(item)
  }
}

// refresh both sidebar regions: the flat conversation list and the fork tree.
function renderSidebar() {
  renderSessionList()
  renderForkGraph()
}

// ---------------------------------------------------------------------------
// fork graph: build a forest from conversations + their forkedFrom links.
// Roots are conversations with no (live) parent; a fork is drawn under its
// parent as a child node, and forks-of-forks nest recursively.
// ---------------------------------------------------------------------------
function buildForest() {
  const byId = new Map(conversationsCache.map(c => [c.id, c]))
  const children = new Map() // parentId -> [child conversation]
  const roots = []
  for (const c of conversationsCache) {
    const parent = c.forkedFrom && byId.get(c.forkedFrom)
    if (parent) {
      if (!children.has(parent.id)) children.set(parent.id, [])
      children.get(parent.id).push(c)
    } else {
      roots.push(c) // includes orphans whose parent was deleted
    }
  }
  const byTime = (a, b) => (a.createdAt || 0) - (b.createdAt || 0) // top-down = chronological
  roots.sort(byTime)
  for (const arr of children.values()) arr.sort(byTime)
  return { roots, children, byId }
}

const ggTipEl = $('ggTip')
let ggTipTimer = null

function showGraphTip(row, conv) {
  const parent = conv.forkedFrom
    ? (conversationsCache.find(c => c.id === conv.forkedFrom) || null)
    : null
  const kind = parent
    ? '分支 · fork 自「' + (parent.title || '未命名') + '」'
    : (conv.forkedFrom ? '分支（父会话已删除）' : '主对话')
  const body = conv.entryPreview && conv.entryPreview.trim()
    ? conv.entryPreview
    : '（暂无第一条消息内容）'
  ggTipEl.innerHTML =
    '<div class="gt-kind">' + esc(kind) + '</div>' +
    '<div class="gt-title">' + esc(conv.title || '未命名会话') + '</div>' +
    '<div class="gt-body">' + esc(body) + '</div>' +
    '<div class="gt-meta">更新于 ' + esc(fmtTime(conv.updatedAt)) + '</div>'
  ggTipEl.style.display = 'block'
  const rect = row.getBoundingClientRect()
  const tw = ggTipEl.offsetWidth || 280
  const th = ggTipEl.offsetHeight || 80
  let left = rect.left + 4
  if (left + tw > window.innerWidth - 8) left = Math.max(8, rect.right - tw - 4)
  let top = rect.bottom + 6
  if (top + th > window.innerHeight - 8) top = Math.max(8, rect.top - th - 6)
  ggTipEl.style.left = left + 'px'
  ggTipEl.style.top = top + 'px'
}

function hideGraphTip() {
  clearTimeout(ggTipTimer)
  ggTipEl.style.display = 'none'
}

function hideGraphTipSoon() {
  clearTimeout(ggTipTimer)
  ggTipTimer = setTimeout(() => { ggTipEl.style.display = 'none' }, 120)
}

function appendGraphNode(hostEl, conv, children, isRoot) {
  const wrap = document.createElement('div')
  wrap.className = 'gg-node' + (conv.id === conversationId ? ' active' : '') +
    (isRoot ? ' root' : ' fork')
  wrap.dataset.id = conv.id
  const row = document.createElement('div')
  row.className = 'gg-row'
  row.innerHTML =
    '<span class="gg-dot"></span>' +
    '<span class="gg-title">' + esc(conv.title || '未命名会话') + '</span>' +
    (conv.running ? '<span class="gg-run">运行中</span>' : '')
  wrap.appendChild(row)
  hostEl.appendChild(wrap)

  row.addEventListener('click', () => switchConversation(conv.id))
  row.addEventListener('mouseenter', () => {
    clearTimeout(ggTipTimer)
    ggTipTimer = setTimeout(() => showGraphTip(row, conv), 220)
  })
  row.addEventListener('mouseleave', hideGraphTipSoon)

  let count = 1
  const kids = children.get(conv.id)
  if (kids && kids.length) {
    const ctr = document.createElement('div')
    ctr.className = 'gg-children'
    for (const k of kids) count += appendGraphNode(ctr, k, children, false)
    wrap.appendChild(ctr)
  }
  return count
}

function renderForkGraph() {
  hideGraphTip()
  const host = $('branchGraph')
  host.innerHTML = ''
  const { roots, children } = buildForest()
  if (!roots.length) {
    host.innerHTML = '<div class="gg-empty">暂无分支</div>'
    return
  }
  let nodes = 0
  for (const r of roots) nodes += appendGraphNode(host, r, children, true)
  if (!nodes) host.innerHTML = '<div class="gg-empty">暂无分支</div>'
}

function resetChatArea(note) {
  messagesEl.innerHTML =
    '<div class="empty" id="emptyState"><h2>' +
    (note ? esc(note) : '本地 OPC Web 界面') + '</h2>' +
    (note
      ? '<p>继续输入即可接着该会话的上下文对话。</p>'
      : '<p>在下方输入问题，回车发送。<br />模型/权限/目录修改后会作用于下一次发送。<br />CLI 事件经 SSE 实时流式显示。</p>') +
    '</div>'
}

async function switchConversation(id) {
  if (running) {
    setStatus('请先停止当前任务再切换会话', 'error')
    return
  }
  if (id === conversationId) return
  hideQuotePopup()
  hideGraphTip()
  const conv = conversationsCache.find(c => c.id === id)
  conversationId = id
  chatId = null
  stream = null
  turnBubble = null
  endAllToolRuns()
  renderSidebar()
  messagesEl.innerHTML = '<div class="empty" id="emptyState"><h2>加载中…</h2></div>'
  setStatus('空闲', 'idle')
  try {
    const res = await fetch('/api/conversations/' + encodeURIComponent(id) + '/messages')
    if (!res.ok) throw new Error(res.statusText)
    const data = await res.json()
    const empty = $('emptyState')
    if (empty) empty.remove()
    const turns = data.turns || []
    if (!turns.length) {
      resetChatArea('会话: ' + (conv ? conv.title : id))
    } else {
      for (const t of turns) renderTurn(t)
      messagesEl.scrollTop = messagesEl.scrollHeight
    }
  } catch (err) {
    resetChatArea('会话加载失败: ' + err.message)
  }
  $('promptInput').focus()
}

// render one stored exchange (user prompt + one assistant turn) into messagesEl
function renderTurn(t) {
  const prompt = t.prompt || ''
  if (prompt) {
    const user = document.createElement('div')
    user.className = 'msg user'
    user.innerHTML = '<div class="avatar">我</div><div class="bubble"><div class="content">' +
      renderMarkdown(prompt) + '</div></div>'
    messagesEl.appendChild(user)
  }
  const asst = document.createElement('div')
  asst.className = 'msg assistant'
  const avatar = document.createElement('div')
  avatar.className = 'avatar'
  avatar.textContent = 'AI'
  const bubble = document.createElement('div')
  bubble.className = 'bubble'
  asst.appendChild(avatar)
  asst.appendChild(bubble)
  for (const b of t.blocks || []) {
    if (b.type === 'think' && b.text) {
      const details = document.createElement('details')
      details.className = 'think'
      details.innerHTML = '<summary><span class="tlabel">已深度思考</span></summary><div class="think-body"></div>'
      details.querySelector('.think-body').textContent = b.text
      bubble.appendChild(details)
    } else if (b.type === 'text') {
      const content = document.createElement('div')
      content.className = 'content'
      content.innerHTML = renderMarkdown(b.text || '')
      bubble.appendChild(content)
    } else if (b.type === 'tool') {
      const div = document.createElement('div')
      div.className = 'tool' + (b.done ? '' : ' running')
      div.innerHTML =
        '<div class="tool-head"><span class="spinner"></span><span class="done"></span>' +
        '<span class="tname">' + esc(b.name || 'tool') + '</span><span class="tcmd"></span></div>'
      div.querySelector('.tcmd').textContent = toolCmdText(b.input)
      bubble.appendChild(div)
    }
  }
  messagesEl.appendChild(asst)
}

function newConversation() {
  if (running) {
    setStatus('请先停止当前任务再新建会话', 'error')
    return
  }
  hideQuotePopup()
  hideGraphTip()
  conversationId = null
  chatId = null
  stream = null
  turnBubble = null
  endAllToolRuns()
  resetChatArea()
  renderSidebar()
  setStatus('空闲', 'idle')
  $('promptInput').focus()
}

// ---------------------------------------------------------------------------
// quote follow-up: select text in an AI reply → ask in a forked conversation
// ---------------------------------------------------------------------------
let quoteSelection = null // captured selected text while the popup is open

function hideQuotePopup() {
  $('quotePopup').classList.remove('open')
  quoteSelection = null
}

function maybeShowQuotePopup() {
  if (running) return
  const pop = $('quotePopup')
  const sel = window.getSelection()
  if (!sel || sel.isCollapsed || !sel.rangeCount) return hideQuotePopup()
  const range = sel.getRangeAt(0)
  const node = range.commonAncestorContainer
  const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement
  // only selections inside assistant bubbles are quotable
  if (!el || !el.closest('.msg.assistant .bubble')) return hideQuotePopup()
  const text = sel.toString().trim()
  if (!text) return hideQuotePopup()

  quoteSelection = { text } // capture before focusing the input clears the selection
  $('qpQuote').textContent = text.length > 160 ? text.slice(0, 160) + '…' : text
  $('qpInput').value = ''
  pop.classList.add('open')

  const rect = range.getBoundingClientRect()
  const pw = 340
  const ph = pop.offsetHeight || 160
  let left = rect.left + rect.width / 2 - pw / 2
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8))
  let top = rect.bottom + 8
  if (top + ph > window.innerHeight - 8) top = Math.max(8, rect.top - ph - 8)
  pop.style.left = left + 'px'
  pop.style.top = top + 'px'
  $('qpInput').focus()
}

async function submitQuoteQuestion() {
  const question = $('qpInput').value.trim()
  if (!question || !quoteSelection) return
  if (!conversationId) {
    hideQuotePopup()
    setStatus('当前没有可追问的会话', 'error')
    return
  }
  if (running) {
    setStatus('请等待当前任务完成再追问', 'error')
    return
  }
  const selected = quoteSelection.text
  const sourceConv = conversationId
  hideQuotePopup()

  const quote = selected.split('\n').map(l => '> ' + l).join('\n')
  const prompt = '关于你之前回复中我选中的这一段：\n\n' + quote + '\n\n我的追问：' + question

  // switch to a fresh view; the forked conversation becomes the active one
  chatId = crypto.randomUUID()
  conversationId = null
  stream = null
  turnBubble = null
  endAllToolRuns()
  resetChatArea()
  addMsg('user', prompt)
  renderSidebar()
  try {
    const data = await post('/api/chat', {
      chatId,
      forkFrom: sourceConv,
      title: question,
      prompt,
      entry: question,
      cwd: $('cwdInput').value.trim() || undefined,
      model: $('modelSel').value || undefined,
      permissionMode: $('permSel').value,
    })
    if (data.chatId !== chatId) chatId = data.chatId
    if (data.conversationId) conversationId = data.conversationId
    loadConversations()
  } catch (err) {
    addSystemMsg('追问失败: ' + err.message, 'error')
    setStatus('错误', 'error')
    running = false
    chatId = null
    $('sendBtn').disabled = false
  }
}

async function deleteSession(id) {
  const conv = conversationsCache.find(c => c.id === id)
  if (!conv) return
  if (conv.running) {
    setStatus('运行中的会话不能删除', 'error')
    return
  }
  const title = (conv.title || '未命名会话').slice(0, 24)
  if (!confirm('删除会话「' + title + '」？\n会同时删除它的本地记录，无法恢复。')) return
  try {
    const res = await fetch('/api/conversations/' + encodeURIComponent(id), { method: 'DELETE' })
    if (!res.ok) {
      const data = await res.json().catch(() => ({}))
      throw new Error(data.error || res.statusText)
    }
  } catch (err) {
    setStatus('删除失败: ' + err.message, 'error')
    return
  }
  if (conversationId === id) {
    conversationId = null
    chatId = null
    stream = null
    turnBubble = null
    resetChatArea()
  }
  loadConversations()
  setStatus('空闲', 'idle')
}

async function post(url, body) {
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  const data = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(data.error || res.statusText)
  return data
}

async function sendMessage() {
  const prompt = $('promptInput').value.trim()
  if (!prompt || running) return
  hideQuotePopup()
  const cwd = $('cwdInput').value.trim() || undefined
  // Generate chatId up front (before POST) so SSE events that arrive while
  // the POST is still in flight — run-start, system/init, assistant — are
  // not mistaken for a different run and dropped.
  chatId = crypto.randomUUID()
  addMsg('user', prompt)
  $('promptInput').value = ''
  autoGrow()
  const body = {
    chatId,
    prompt,
    entry: prompt,
    cwd,
    model: $('modelSel').value || undefined,
    permissionMode: $('permSel').value,
  }
  const send = () => {
    if (conversationId) body.conversationId = conversationId
    return post('/api/chat', body)
  }
  try {
    let data
    try {
      data = await send()
    } catch (err) {
      // stale conversation (e.g. server store reset): start a new one
      if (conversationId && /not found/i.test(err.message || '')) {
        conversationId = null
        delete body.conversationId
        data = await send()
      } else {
        throw err
      }
    }
    if (data.chatId !== chatId) chatId = data.chatId // server is authoritative
    if (data.conversationId) conversationId = data.conversationId
    loadConversations()
  } catch (err) {
    addSystemMsg('发送失败: ' + err.message, 'error')
    setStatus('错误', 'error')
    running = false
    chatId = null
    $('sendBtn').disabled = false
  }
}

async function stopRun() {
  if (!chatId) return
  try {
    await post('/api/stop', { chatId })
    setStatus('正在停止…', 'running')
  } catch (err) {
    addSystemMsg('停止失败: ' + err.message, 'error')
  }
}

// ---------------------------------------------------------------------------
// events & bootstrap
// ---------------------------------------------------------------------------
$('sendBtn').onclick = sendMessage
$('stopBtn').onclick = stopRun
$('newChatBtn').onclick = newConversation
$('promptInput').addEventListener('keydown', ev => {
  if (ev.isComposing) return // IME composition confirm — don't send mid-typing
  if (ev.key === 'Enter' && !ev.shiftKey) {
    ev.preventDefault()
    sendMessage()
  }
})
const autoGrow = () => {
  $('promptInput').style.height = 'auto'
  $('promptInput').style.height = Math.min($('promptInput').scrollHeight, 180) + 'px'
}
$('promptInput').addEventListener('input', autoGrow)

$('permAllow').onclick = () => {
  if (!currentPerm) return
  const { requestId } = currentPerm
  $('permBackdrop').classList.remove('open')
  post('/api/control', { chatId, requestId, allow: true }).catch(() => {})
  currentPerm = null
}
$('permDeny').onclick = () => {
  if (!currentPerm) return
  const { requestId } = currentPerm
  $('permBackdrop').classList.remove('open')
  post('/api/control', { chatId, requestId, allow: false }).catch(() => {})
  currentPerm = null
}
$('permBackdrop').onclick = ev => {
  if (ev.target === $('permBackdrop')) {
    // ignore click-outside for now (would block the CLI); keep modal
  }
}

// ---------------------------------------------------------------------------
// quote follow-up: selecting text inside an AI reply opens the #quotePopup;
// submitting forks a NEW conversation off the current one (see submitQuoteQuestion).
// ---------------------------------------------------------------------------
const isInsideQuotePopup = t =>
  t && typeof t.closest === 'function' && !!t.closest('#quotePopup')

// closing on outside mousedown: hide any stale popup before the next gesture
// begins; if that gesture is a fresh drag-select, its mouseup reopens the popup.
document.addEventListener('mousedown', ev => {
  const pop = $('quotePopup')
  if (!pop.classList.contains('open') || isInsideQuotePopup(ev.target)) return
  hideQuotePopup()
})

// mouseup is the primary trigger (drag or double-click to select). Wait one
// tick so the browser finalises the selection before we read its text + rect.
document.addEventListener('mouseup', ev => {
  if (running || isInsideQuotePopup(ev.target)) return
  setTimeout(() => maybeShowQuotePopup(), 0)
})

// keyboard selection (Shift/Alt/⌘+arrows) with the caret in the message body.
document.addEventListener('keyup', ev => {
  if (running) return
  const ae = document.activeElement
  if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return
  if (!(ev.shiftKey || ev.ctrlKey || ev.metaKey)) return
  setTimeout(() => maybeShowQuotePopup(), 0)
})

// popup actions: 追问 → fork-ask; 取消 / Esc → close; Enter → submit.
$('qpAsk').onclick = submitQuoteQuestion
$('qpCancel').onclick = hideQuotePopup
$('qpInput').addEventListener('keydown', ev => {
  if (ev.isComposing) return // IME composition confirm — don't submit mid-typing
  if (ev.key === 'Enter') {
    ev.preventDefault()
    submitQuoteQuestion()
  } else if (ev.key === 'Escape') {
    ev.preventDefault()
    hideQuotePopup()
  }
})

// scrolling moves the selected text away from the popup → close it.
messagesEl.addEventListener('scroll', hideQuotePopup)

connectEvents()
loadConversations()
$('promptInput').focus()
</script>
</body>
</html>
